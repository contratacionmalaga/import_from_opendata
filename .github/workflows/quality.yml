name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven and Dependency Check data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/dependency-check-data
          key: maven-quality-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-quality-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Set up private Maven packages
        uses: ./.github/actions/setup-maven-private
        with:
          package-token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install local CODICE artifacts
        run: |
          ./mvnw -B -ntp install:install-file -Dfile=lib/atom-1.0.jar -DgroupId=org.w3._2005.atom -DartifactId=atom -Dversion=1.0 -Dpackaging=jar
          ./mvnw -B -ntp install:install-file -Dfile=lib/codice-2.8.0.jar -DgroupId=place.codice -DartifactId=codice -Dversion=2.8.0 -Dpackaging=jar
          ./mvnw -B -ntp install:install-file -Dfile=lib/codice-ext-1.5.0.jar -DgroupId=place.codice -DartifactId=codice-ext -Dversion=1.5.0 -Dpackaging=jar

      - name: Quality checks
        run: ./mvnw -B -ntp -Pquality verify