name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          VERSION="${TAG#v}"
          if [[ -z "$TAG" || -z "$VERSION" || "$TAG" == "$VERSION" ]]; then
            echo "Release tag must use v<version> format, for example v1.2.3" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-releases
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Cache Maven and Dependency Check data
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/dependency-check-data
          key: maven-release-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-release-${{ runner.os }}-
            maven-${{ runner.os }}-

      - name: Set up private Maven packages
        uses: ./.github/actions/setup-maven-private
        with:
          package-token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          publish-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Set up project artifacts
        uses: ./.github/actions/setup-project-artifacts

      - name: Verify release version
        shell: bash
        run: |
          PROJECT_VERSION="$(sed -n '0,/<packaging>/s:.*<version>\(.*\)</version>.*:\1:p' pom.xml | tail -n 1)"
          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not resolve project version from pom.xml" >&2
            exit 1
          fi
          if [[ "$PROJECT_VERSION" != "${{ steps.release.outputs.version }}" ]]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match pom.xml version $PROJECT_VERSION" >&2
            exit 1
          fi

      - name: Build
        run: ./mvnw -B -ntp clean verify -Dartifact.suffix=release-check -Dprofile.suffix=ci

      - name: Build release artifacts
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          profiles=(
            "con-filtros-local:opendata_con_filtros-${VERSION}-local.jar"
            "con-filtros-internet:opendata_con_filtros-${VERSION}-internet.jar"
            "sin-filtros-local:opendata_sin_filtros-${VERSION}-local.jar"
            "sin-filtros-internet:opendata_sin_filtros-${VERSION}-internet.jar"
          )

          for item in "${profiles[@]}"; do
            profile="${item%%:*}"
            expected="target/${item#*:}"
            echo "Building release artifact with profile ${profile}"
            ./mvnw -B -ntp package -P"${profile}" -DskipTests
            if [[ ! -f "${expected}" ]]; then
              echo "Expected artifact was not generated: ${expected}" >&2
              exit 1
            fi
          done

      - name: Validate release artifacts
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          expected=(
            "target/opendata_con_filtros-${VERSION}-local.jar"
            "target/opendata_con_filtros-${VERSION}-internet.jar"
            "target/opendata_sin_filtros-${VERSION}-local.jar"
            "target/opendata_sin_filtros-${VERSION}-internet.jar"
          )

          for artifact in "${expected[@]}"; do
            if [[ ! -f "${artifact}" ]]; then
              echo "Missing release artifact: ${artifact}" >&2
              exit 1
            fi
          done

          if compgen -G "target/artifact.suffix*.jar" > /dev/null || compgen -G "target/original-.artifact.suffix*.jar" > /dev/null; then
            echo "Found unresolved artifact.suffix/profile.suffix artifact names in target." >&2
            ls -la target/*.jar
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          NOTES_FILE="docs/releases/${TAG}.md"
          if [[ ! -f "${NOTES_FILE}" ]]; then
            echo "Release notes file not found: ${NOTES_FILE}" >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --title "Release ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" \
              --title "Release ${VERSION}" \
              --notes-file "${NOTES_FILE}"
          fi

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          artifacts=(
            "target/opendata_con_filtros-${VERSION}-local.jar"
            "target/opendata_con_filtros-${VERSION}-internet.jar"
            "target/opendata_sin_filtros-${VERSION}-local.jar"
            "target/opendata_sin_filtros-${VERSION}-internet.jar"
          )
          gh release upload "${{ steps.release.outputs.tag }}" "${artifacts[@]}" --clobber
