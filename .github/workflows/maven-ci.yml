name: Java CI with Maven

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build and quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up private Maven packages
        uses: ./.github/actions/setup-maven-private
        with:
          package-token: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install local CODICE artifacts
        run: |
          mvn -B install:install-file -Dfile=lib/atom-1.0.jar -DgroupId=org.w3._2005.atom -DartifactId=atom -Dversion=1.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=lib/codice-2.8.0.jar -DgroupId=place.codice -DartifactId=codice -Dversion=2.8.0 -Dpackaging=jar
          mvn -B install:install-file -Dfile=lib/codice-ext-1.5.0.jar -DgroupId=place.codice -DartifactId=codice-ext -Dversion=1.5.0 -Dpackaging=jar

      - name: Test
        run: mvn -B test

      - name: Spotless
        run: mvn -B spotless:check

      - name: SpotBugs security scan
        run: mvn -B spotbugs:check

